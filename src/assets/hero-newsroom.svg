<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Dark product display with app tiles and cool light">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1218"/>
      <stop offset="40%" stop-color="#0c0a0e"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="spot" cx="55%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#6a2030" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#1a0c12" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1e24"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1420"/>
      <stop offset="50%" stop-color="#1a0e14"/>
      <stop offset="100%" stop-color="#0e0a10"/>
    </linearGradient>
    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blurLite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>

  <!-- soft ambient bloom -->
  <ellipse cx="900" cy="380" rx="520" ry="300" fill="#C8FF2A" opacity="0.04" filter="url(#blurSoft)"/>

  <!-- display chassis -->
  <rect x="220" y="90" width="1160" height="620" rx="18" fill="url(#bezel)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="248" y="118" width="1104" height="540" rx="4" fill="url(#screenBg)"/>

  <!-- top status strip -->
  <rect x="280" y="150" width="72" height="28" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="368" y="156" width="90" height="16" rx="2" fill="rgba(255,255,255,0.18)"/>
  <circle cx="1280" cy="164" r="10" fill="rgba(255,255,255,0.2)"/>
  <circle cx="1312" cy="164" r="10" fill="rgba(255,255,255,0.15)"/>

  <!-- app tiles row -->
  <g filter="url(#blurLite)" opacity="0.35">
    <rect x="300" y="260" width="220" height="140" rx="12" fill="#2a1018"/>
    <rect x="560" y="260" width="220" height="140" rx="12" fill="#24141c"/>
    <rect x="820" y="260" width="220" height="140" rx="12" fill="#2c121a"/>
  </g>
  <rect x="300" y="260" width="220" height="140" rx="12" fill="#3a1822" stroke="rgba(255,255,255,0.1)"/>
  <rect x="560" y="260" width="220" height="140" rx="12" fill="#321820" stroke="rgba(255,255,255,0.1)"/>
  <rect x="820" y="260" width="220" height="140" rx="12" fill="#3e1a24" stroke="rgba(255,255,255,0.1)"/>
  <rect x="1080" y="260" width="220" height="140" rx="12" fill="#2a141c" stroke="rgba(255,255,255,0.08)"/>

  <!-- chartreuse signal mark on lead tile -->
  <rect x="324" y="292" width="48" height="8" rx="2" fill="#C8FF2A" opacity="0.9"/>
  <rect x="324" y="314" width="120" height="8" rx="2" fill="rgba(244,245,247,0.55)"/>
  <rect x="324" y="334" width="90" height="8" rx="2" fill="rgba(244,245,247,0.28)"/>

  <rect x="584" y="292" width="100" height="8" rx="2" fill="rgba(244,245,247,0.45)"/>
  <rect x="584" y="314" width="140" height="8" rx="2" fill="rgba(244,245,247,0.25)"/>

  <rect x="844" y="292" width="80" height="8" rx="2" fill="rgba(244,245,247,0.4)"/>
  <rect x="844" y="314" width="130" height="8" rx="2" fill="rgba(244,245,247,0.22)"/>

  <!-- secondary row -->
  <rect x="300" y="430" width="160" height="100" rx="10" fill="#24141a" stroke="rgba(255,255,255,0.07)"/>
  <rect x="490" y="430" width="160" height="100" rx="10" fill="#24141a" stroke="rgba(255,255,255,0.07)"/>
  <rect x="680" y="430" width="160" height="100" rx="10" fill="#24141a" stroke="rgba(255,255,255,0.07)"/>
  <rect x="870" y="430" width="160" height="100" rx="10" fill="#24141a" stroke="rgba(255,255,255,0.07)"/>
  <rect x="1060" y="430" width="160" height="100" rx="10" fill="#1e1218" stroke="rgba(255,255,255,0.05)"/>

  <!-- stand -->
  <rect x="740" y="710" width="120" height="50" fill="#0c0d10"/>
  <rect x="680" y="760" width="240" height="18" rx="3" fill="#14161a"/>

  <!-- floor reflection -->
  <rect x="0" y="780" width="1600" height="120" fill="#030304"/>
  <ellipse cx="800" cy="820" rx="420" ry="28" fill="#C8FF2A" opacity="0.03" filter="url(#blurSoft)"/>
</svg>
