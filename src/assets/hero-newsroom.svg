<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Dim newsroom with stacked monitors casting cool light">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#151820"/>
      <stop offset="45%" stop-color="#0d0f14"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="lamp" cx="72%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#C8FF2A" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#3a4520" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0C0E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberWash" cx="12%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#FF6A1A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0C0E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3648"/>
      <stop offset="55%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="chartreuseBleed" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#C8FF2A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C8FF2A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="50%" stop-color="#1a1e28"/>
      <stop offset="100%" stop-color="#101218"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#lamp)"/>
  <rect width="1600" height="900" fill="url(#amberWash)"/>

  <!-- distant wall panels -->
  <rect x="0" y="80" width="1600" height="2" fill="rgba(244,245,247,0.04)"/>
  <rect x="0" y="200" width="1600" height="1" fill="rgba(244,245,247,0.03)"/>

  <!-- ambient bloom behind center screen -->
  <ellipse cx="840" cy="320" rx="380" ry="220" fill="#C8FF2A" opacity="0.07" filter="url(#soft)"/>

  <!-- left secondary monitor -->
  <g transform="translate(120 250)">
    <rect width="380" height="250" rx="3" fill="#0a0c10" stroke="rgba(255,255,255,0.1)"/>
    <rect x="14" y="14" width="352" height="200" fill="url(#glass)"/>
    <rect x="14" y="14" width="352" height="70" fill="url(#chartreuseBleed)" opacity="0.55"/>
    <rect x="36" y="48" width="120" height="8" rx="1" fill="#C8FF2A" opacity="0.9"/>
    <rect x="36" y="72" width="200" height="6" rx="1" fill="#8B919A" opacity="0.45"/>
    <rect x="36" y="92" width="160" height="6" rx="1" fill="#8B919A" opacity="0.3"/>
    <rect x="36" y="130" width="90" height="50" rx="1" fill="#1c2230" stroke="rgba(200,255,42,0.2)"/>
    <rect x="140" y="130" width="90" height="50" rx="1" fill="#1c2230" stroke="rgba(255,255,255,0.08)"/>
    <rect x="160" y="214" width="60" height="50" fill="#0e1015"/>
    <rect x="120" y="262" width="140" height="10" rx="1" fill="#1a1d24"/>
  </g>

  <!-- hero center monitor -->
  <g transform="translate(480 120)">
    <rect width="640" height="400" rx="3" fill="#080a0e" stroke="rgba(255,255,255,0.14)"/>
    <rect x="18" y="18" width="604" height="330" fill="url(#glass)"/>
    <rect x="18" y="18" width="604" height="140" fill="url(#chartreuseBleed)" opacity="0.7"/>
    <!-- faux article UI -->
    <rect x="48" y="70" width="280" height="16" rx="1" fill="#F4F5F7" opacity="0.92"/>
    <rect x="48" y="102" width="420" height="10" rx="1" fill="#8B919A" opacity="0.5"/>
    <rect x="48" y="126" width="360" height="10" rx="1" fill="#8B919A" opacity="0.35"/>
    <rect x="48" y="180" width="200" height="120" rx="2" fill="#141820" stroke="rgba(200,255,42,0.25)"/>
    <rect x="48" y="180" width="200" height="40" fill="#C8FF2A" opacity="0.15"/>
    <rect x="270" y="180" width="200" height="120" rx="2" fill="#141820" stroke="rgba(255,255,255,0.08)"/>
    <rect x="492" y="180" width="100" height="120" rx="2" fill="#141820" stroke="rgba(255,106,26,0.35)"/>
    <rect x="280" y="348" width="80" height="70" fill="#0c0e12"/>
    <rect x="230" y="416" width="180" height="12" rx="1" fill="#1c1f26"/>
  </g>

  <!-- right tall monitor -->
  <g transform="translate(1120 180)">
    <rect width="320" height="360" rx="3" fill="#0a0c10" stroke="rgba(255,255,255,0.1)"/>
    <rect x="12" y="12" width="296" height="300" fill="url(#glass)"/>
    <rect x="32" y="40" width="80" height="8" rx="1" fill="#FF6A1A" opacity="0.85"/>
    <rect x="32" y="68" width="220" height="8" rx="1" fill="#F4F5F7" opacity="0.7"/>
    <rect x="32" y="92" width="180" height="7" rx="1" fill="#8B919A" opacity="0.4"/>
    <rect x="32" y="120" width="256" height="1" fill="rgba(255,255,255,0.08)"/>
    <rect x="32" y="140" width="200" height="7" rx="1" fill="#8B919A" opacity="0.35"/>
    <rect x="32" y="160" width="170" height="7" rx="1" fill="#8B919A" opacity="0.28"/>
    <rect x="32" y="180" width="210" height="7" rx="1" fill="#8B919A" opacity="0.22"/>
    <rect x="32" y="220" width="256" height="70" rx="1" fill="#12151c" stroke="rgba(255,255,255,0.06)"/>
    <rect x="130" y="312" width="60" height="55" fill="#0e1015"/>
    <rect x="100" y="365" width="120" height="10" rx="1" fill="#1a1d24"/>
  </g>

  <!-- desk plane -->
  <path d="M0 620 L1600 560 L1600 900 L0 900 Z" fill="#07080a"/>
  <path d="M0 620 L1600 560 L1600 578 L0 638 Z" fill="url(#deskTop)"/>
  <path d="M0 638 L1600 578 L1600 584 L0 644 Z" fill="rgba(200,255,42,0.06)"/>

  <!-- keyboard / notebook silhouettes -->
  <rect x="520" y="680" width="360" height="18" rx="2" fill="#151820" stroke="rgba(255,255,255,0.06)"/>
  <rect x="540" y="668" width="40" height="8" rx="1" fill="#1c2230"/>
  <rect x="980" y="700" width="140" height="90" rx="2" fill="#12151a" stroke="rgba(255,255,255,0.05)" transform="rotate(-6 1050 745)"/>
  <circle cx="1180" cy="720" r="28" fill="#141820" stroke="rgba(255,106,26,0.25)"/>
  <circle cx="1180" cy="720" r="10" fill="#FF6A1A" opacity="0.35"/>

  <!-- foreground vignette -->
  <rect width="1600" height="900" fill="url(#sky)" opacity="0.15"/>
</svg>
