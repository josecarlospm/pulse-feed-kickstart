<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Dark product display with app tiles and cool light">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22141c"/>
      <stop offset="35%" stop-color="#0e0b10"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="spot" cx="58%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#8a2838" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#2a1018" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23262e"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a1828"/>
      <stop offset="45%" stop-color="#1c0e16"/>
      <stop offset="100%" stop-color="#0c0810"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="blurLite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>

  <ellipse cx="980" cy="320" rx="560" ry="320" fill="#C8FF2A" opacity="0.045" filter="url(#blurSoft)"/>
  <ellipse cx="420" cy="560" rx="280" ry="180" fill="#FF6A1A" opacity="0.05" filter="url(#blurSoft)"/>

  <!-- display chassis -->
  <rect x="180" y="70" width="1240" height="660" rx="22" fill="url(#bezel)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="210" y="100" width="1180" height="580" rx="6" fill="url(#screenBg)"/>
  <rect x="210" y="100" width="1180" height="580" rx="6" fill="url(#glass)"/>

  <!-- top chrome -->
  <rect x="248" y="132" width="78" height="30" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="340" y="140" width="110" height="14" rx="2" fill="rgba(255,255,255,0.22)"/>
  <rect x="1188" y="136" width="72" height="22" rx="11" fill="rgba(255,255,255,0.1)"/>
  <rect x="1272" y="136" width="72" height="22" rx="11" fill="rgba(255,255,255,0.08)"/>

  <!-- soft glow behind tiles -->
  <g filter="url(#blurLite)" opacity="0.4">
    <rect x="268" y="240" width="240" height="160" rx="14" fill="#3a1420"/>
    <rect x="548" y="240" width="240" height="160" rx="14" fill="#2c121a"/>
    <rect x="828" y="240" width="240" height="160" rx="14" fill="#401820"/>
  </g>

  <!-- primary tiles -->
  <rect x="268" y="240" width="240" height="160" rx="14" fill="#421822" stroke="rgba(255,255,255,0.12)"/>
  <rect x="548" y="240" width="240" height="160" rx="14" fill="#36141e" stroke="rgba(255,255,255,0.1)"/>
  <rect x="828" y="240" width="240" height="160" rx="14" fill="#461a26" stroke="rgba(255,255,255,0.1)"/>
  <rect x="1108" y="240" width="240" height="160" rx="14" fill="#2e141c" stroke="rgba(255,255,255,0.08)"/>

  <rect x="296" y="278" width="56" height="10" rx="2" fill="#C8FF2A" opacity="0.95"/>
  <rect x="296" y="304" width="140" height="10" rx="2" fill="rgba(244,245,247,0.62)"/>
  <rect x="296" y="328" width="100" height="10" rx="2" fill="rgba(244,245,247,0.3)"/>

  <rect x="576" y="278" width="120" height="10" rx="2" fill="rgba(244,245,247,0.5)"/>
  <rect x="576" y="304" width="150" height="10" rx="2" fill="rgba(244,245,247,0.28)"/>

  <rect x="856" y="278" width="96" height="10" rx="2" fill="rgba(244,245,247,0.45)"/>
  <rect x="856" y="304" width="140" height="10" rx="2" fill="rgba(244,245,247,0.24)"/>

  <rect x="1136" y="278" width="80" height="10" rx="2" fill="rgba(244,245,247,0.35)"/>
  <rect x="1136" y="304" width="120" height="10" rx="2" fill="rgba(244,245,247,0.18)"/>

  <!-- secondary row -->
  <rect x="268" y="440" width="170" height="110" rx="12" fill="#26141a" stroke="rgba(255,255,255,0.08)"/>
  <rect x="468" y="440" width="170" height="110" rx="12" fill="#26141a" stroke="rgba(255,255,255,0.08)"/>
  <rect x="668" y="440" width="170" height="110" rx="12" fill="#26141a" stroke="rgba(255,255,255,0.08)"/>
  <rect x="868" y="440" width="170" height="110" rx="12" fill="#26141a" stroke="rgba(255,255,255,0.08)"/>
  <rect x="1068" y="440" width="170" height="110" rx="12" fill="#201218" stroke="rgba(255,255,255,0.06)"/>
  <rect x="1268" y="440" width="80" height="110" rx="12" fill="#1a1014" stroke="rgba(255,255,255,0.04)"/>

  <!-- stand -->
  <rect x="740" y="730" width="120" height="48" fill="#0c0d10"/>
  <rect x="670" y="778" width="260" height="16" rx="3" fill="#14161a"/>

  <!-- floor -->
  <rect x="0" y="800" width="1600" height="100" fill="#030304"/>
  <ellipse cx="800" cy="830" rx="460" ry="30" fill="#C8FF2A" opacity="0.035" filter="url(#blurSoft)"/>
</svg>
